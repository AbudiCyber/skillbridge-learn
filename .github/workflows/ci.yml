name: SkillBridge CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find js -type f -name "*.js" -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Run Core QA Suite
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { ROUTES } from "./js/constants.js";
          import { lessons } from "./js/data/lessons.js";
          import { vocabularySections } from "./js/data/vocabularySections.js";
          import { quizzes } from "./js/data/quizzes.js";
          import { units } from "./js/data/units.js";
          import { words } from "./js/data/words.js";
          import { ROUTE_PAGES, CORE_ASSETS, REQUIRED_ASSETS, REQUIRED_ENGINES } from "./js/config/appShellAssets.js";
          import { APP_VERSION, CACHE_VERSION, CACHE_PREFIX } from "./js/config/appMeta.js";
          import { runContentQA } from "./js/engines/contentQaEngine.js";
          import { runRuntimeQA } from "./js/engines/runtimeQaEngine.js";
          import { runStorageQA } from "./js/engines/storageQaEngine.js";
          import { runReviewSessionQA } from "./js/engines/reviewSessionQaEngine.js";
          import { runDailyGoalQA } from "./js/engines/dailyGoalQaEngine.js";
          import { runLearningGoalQA } from "./js/engines/learningGoalQaEngine.js";
          import { runAchievementQA } from "./js/engines/achievementQaEngine.js";
          import { runStreakQA } from "./js/engines/streakQaEngine.js";
          import { runProgressQA } from "./js/engines/progressQaEngine.js";

          const reports = {
            content: runContentQA({
              lessons,
              units,
              words,
              quizzes,
              vocabularySections,
              routes: ROUTES,
              routePages: ROUTE_PAGES,
              appShellAssets: CORE_ASSETS,
              requiredAssets: REQUIRED_ASSETS,
              requiredEngines: REQUIRED_ENGINES,
              appVersion: APP_VERSION,
              cacheVersion: CACHE_VERSION,
              cachePrefix: CACHE_PREFIX
            }),
            runtime: runRuntimeQA({ routes: ROUTES, lessons, vocabularySections }),
            storage: runStorageQA({ routes: ROUTES, lessons, vocabularySections }),
            reviewSession: runReviewSessionQA(),
            dailyGoal: runDailyGoalQA(),
            learningGoal: runLearningGoalQA(),
            achievement: runAchievementQA(),
            streak: runStreakQA(),
            progress: runProgressQA()
          };

          console.log(JSON.stringify(reports, null, 2));

          const failures = Object.entries(reports)
            .filter(([, report]) => report.status !== "pass")
            .map(([name]) => name);

          if (failures.length) {
            console.error("QA suites failed:", failures.join(", "));
            process.exit(1);
          }
          EOF
